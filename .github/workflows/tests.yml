name: Python tests

on:
  push:
    branches: ["main", "oss-readiness/**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install runtime dependencies
        run: python -m pip install --upgrade pip pyyaml click rich

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Validate example brief
        run: python generate.py --brief briefs/example.yaml --dry-run
